<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地產國考練習室</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><div><small>不動產經紀人｜AI 學習系統</small><h1>把每一次答錯，變成下一次拿分。</h1></div><button id="today">今天練習 20 題</button></header>
<main><section id="dashboard" class="grid"></section><section class="exam"><div class="exam-head"><div><div class="selectors"><label>年份 <select id="year-select" aria-label="選擇年份"></select></label><label>科目 <select id="subject-select" aria-label="選擇科目"></select></label><fieldset class="mode-switch"><legend>作答模式</legend><button type="button" data-mode="exam" class="active">考試模式</button><button type="button" data-mode="review">複習模式</button></fieldset></div><h2 id="subject-title">民法概要</h2><p id="mode-hint">交卷前不顯示答案與詳解，可自由修改答案。</p></div><div id="timer">90:00</div></div><div id="empty"><p>官方真題已儲存在本機，不會在作答時重新抓網站。</p><button id="start">開始完整試卷</button></div><div id="runner" hidden><div class="progress"><i id="bar"></i></div><nav id="nav"></nav><article><p id="meta"></p><h3 id="question"></h3><div id="options"></div><div id="instant-feedback" hidden></div><textarea id="essay" hidden placeholder="依爭點、法律依據、涵攝、結論作答"></textarea><div class="actions"><button id="prev">上一題</button><button id="mark">☆ 稍後再看</button><button id="next">下一題</button><button class="danger" id="submit">交卷</button></div></article></div><div id="result" hidden></div></section></main>
<script src="./app.js"></script></body></html>
