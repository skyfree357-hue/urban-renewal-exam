const ADMIN_PASSWORD='0512';
function showAdmin(show) { $('examView').classList.toggle('hidden',show);$('adminView').classList.toggle('hidden',!show);$('adminToggle').textContent=show?'返回前台測驗':'進入後台管理';if(show)renderList(); }
function openAdminLock(){ $('adminPasswordInput').value='';$('adminPasswordError').classList.add('hidden');$('adminPasswordModal').classList.remove('hidden');$('adminPasswordModal').classList.add('flex');setTimeout(()=>$('adminPasswordInput').focus(),0); }
function closeAdminLock(){ $('adminPasswordModal').classList.add('hidden');$('adminPasswordModal').classList.remove('flex'); }
function toggleAdmin() { if(!$('adminView').classList.contains('hidden')) return showAdmin(false); openAdminLock(); }
function renderList(){const type=$('filterType').value,no=$('filterNo').value.trim(),text=$('filterText').value.trim().toLowerCase();const rows=[];for(const t of ['single_choice','multiple_choice'])if(type==='all'||type===t)bank[t].forEach((q,i)=>{if((!no||String(q.id).includes(no))&&(!text||q.question.toLowerCase().includes(text)))rows.push(`<button data-type="${t}" data-index="${i}" class="edit-row w-full rounded-xl border p-3 text-left hover:bg-indigo-50"><b class="text-indigo-700">${t==='single_choice'?'單選':'複選'}｜原始題號 ${esc(q.id)}</b><span class="ml-2 text-sm text-slate-600">${esc(q.question).slice(0,80)}</span></button>`)});$('questionList').innerHTML=rows.length?rows.join(''):'<p class="p-3 text-sm text-slate-500">找不到符合的題目。</p>';document.querySelectorAll('.edit-row').forEach(b=>b.onclick=()=>openEditor(b.dataset.type,+b.dataset.index));}
function nextQuestionId(type){return bank[type].reduce((max,q)=>Math.max(max,Number(q.id)||0),0)+1;}
function openEditor(type,index=null){const isNew=index===null;const q=isNew?{id:nextQuestionId(type),question:'',options:['','','',''],answer:[]}:bank[type][index];$('editor').classList.remove('hidden');$('editType').value=type;$('editIndex').value=isNew?'new':String(index);$('deleteBtn').classList.toggle('hidden',isNew);$('editTitle').textContent=`${isNew?'新增':'編輯'}${type==='single_choice'?'單選':'複選'}題｜原始題號：${q.id}`;$('editQuestion').value=q.question;$('optionEditors').innerHTML=[0,1,2,3].map(i=>`<label class="text-sm font-bold">選項 ${'ABCD'[i]}<input class="option-input mt-1 w-full rounded-xl border p-3" required value="${attr(q.options[i]||'')}"></label>`).join('');$('answerEditors').innerHTML=[0,1,2,3].map(i=>`<label class="flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2"><input type="${type==='single_choice'?'radio':'checkbox'}" name="correct-answer" value="${i}" ${q.answer.includes(i)?'checked':''}> ${'ABCD'[i]}</label>`).join('');$('editor').scrollIntoView({behavior:'smooth',block:'start'});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function attr(s){return esc(s);}
function submitExam(){
  if(submitted) return false;
  try {
    let correct=0;
    const correctItems=[],wrongItems=[];
    exam.forEach((q,qi)=>{
      const selected=[...document.querySelectorAll(`input[name="q-${qi}"]:checked`)].map(x=>+x.value).sort();
      const right=Array.isArray(q.answer)?[...q.answer].filter(Number.isInteger).sort():[];
      const ok=right.length>0&&selected.length===right.length&&selected.every((v,i)=>v===right[i]);
      if(ok)correct++;
      (ok?correctItems:wrongItems).push({q,qi,selected,right});
      (q.options||[]).forEach((_,oi)=>{
        const el=$(`choice-${qi}-${oi}`);
        if(!el)return;
        if(right.includes(oi))el.classList.add('correct');
        if(selected.includes(oi)&&!right.includes(oi))el.classList.add('wrong');
      });
      const fb=$(`feedback-${qi}`);
      if(fb){fb.classList.remove('hidden');fb.innerHTML=`<b class="${ok?'text-green-700':'text-red-700'}">${ok?'答對！':'答錯。'}</b> 正確答案：${right.length?right.map(i=>'ABCD'[i]).join('、'):'題庫未設定'}`;}
    });
    const renderSummary=(items,kind)=>items.length?items.map(({q,qi,selected,right})=>{
      const type=q.type==='single_choice'?'單選題':'複選題',your=selected.length?selected.map(i=>'ABCD'[i]).join('、'):'未作答',answer=right.length?right.map(i=>'ABCD'[i]).join('、'):'題庫未設定';
      return `<article class="rounded-xl border p-3 text-sm ${kind==='correct'?'border-green-200 bg-green-50':'border-red-200 bg-red-50'}"><p class="font-black">【${type}】原始題號：${esc(q.id)}</p><p class="mt-1 leading-6">${esc(q.question)}</p><p class="mt-2 ${kind==='correct'?'text-green-800':'text-red-700'}">你的答案：${your}</p>${kind==='wrong'?`<p class="mt-1 font-bold text-green-800">正確答案：${answer}</p>`:''}<a href="#choice-${qi}-0" class="mt-2 inline-block font-bold text-teal-700 underline">查看原題</a></article>`;
    }).join(''):'<p class="rounded-xl bg-slate-50 p-3 text-sm text-slate-500">沒有題目。</p>';
    const score=$('score'),scoreText=$('scoreText'),correctCount=$('correctSummaryCount'),wrongCount=$('wrongSummaryCount'),correctSummary=$('correctSummary'),wrongSummary=$('wrongSummary'),result=$('result');
    if(!score||!scoreText||!correctCount||!wrongCount||!correctSummary||!wrongSummary||!result)throw Error('成績區元件未載入');
    score.textContent=`${correct*2} 分`;scoreText.textContent=`答對 ${correct} / ${exam.length} 題`;correctCount.textContent=`共 ${correctItems.length} 題`;wrongCount.textContent=`共 ${wrongItems.length} 題`;correctSummary.innerHTML=renderSummary(correctItems,'correct');wrongSummary.innerHTML=renderSummary(wrongItems,'wrong');result.classList.remove('hidden');
    submitted=true;
    const topButton=$('submitBtn');if(topButton){topButton.disabled=true;topButton.classList.add('opacity-50');}
    return true;
  } catch(err) { console.error('submit exam failed',err); alert('交卷時發生問題，請再按一次交卷。你的作答不會遺失。'); return false; }
}
function submitExamAndShowResults(){ if(submitExam()){ const bottom=$('submitBtnBottom'),floating=$('floatingSubmit'),result=$('result');if(bottom){bottom.disabled=true;bottom.classList.add('opacity-50');}if(floating)floating.classList.add('hidden');requestAnimationFrame(()=>result.scrollIntoView({behavior:'smooth',block:'start'})); } }
$('startBtn').onclick=startExam;$('retryBtn').onclick=startExam;$('submitBtn').onclick=submitExamAndShowResults;$('submitBtnBottom').onclick=submitExamAndShowResults;$('floatingSubmit').onclick=submitExamAndShowResults;$('adminToggle').onclick=toggleAdmin;$('staffToggle').onclick=toggleAdmin;
$('addSingleBtn').onclick=()=>openEditor('single_choice');$('addMultipleBtn').onclick=()=>openEditor('multiple_choice');
$('adminPasswordCancel').onclick=closeAdminLock;$('adminPasswordForm').onsubmit=e=>{e.preventDefault();if($('adminPasswordInput').value!==ADMIN_PASSWORD){$('adminPasswordError').classList.remove('hidden');$('adminPasswordInput').focus();return;}sessionStorage.setItem('staffAdminVerified','true');closeAdminLock();showAdmin(true);};
['filterType','filterNo','filterText'].forEach(id=>$(id).addEventListener('input',renderList));
$('editor').onsubmit=e=>{e.preventDefault();const type=$('editType').value,indexToken=$('editIndex').value,isNew=indexToken==='new',index=Number(indexToken),answers=[...document.querySelectorAll('input[name="correct-answer"]:checked')].map(x=>+x.value);if(!answers.length)return alert('請選擇正確答案。');const data={id:isNew?nextQuestionId(type):bank[type][index].id,question:$('editQuestion').value.trim(),options:[...document.querySelectorAll('.option-input')].map(x=>x.value.trim()),answer:answers};if(!data.question||data.options.some(x=>!x))return alert('請填寫題目與四個選項。');if(isNew){bank[type].push(data);$('editIndex').value=String(bank[type].length-1);$('deleteBtn').classList.remove('hidden');$('editTitle').textContent=`編輯${type==='single_choice'?'單選':'複選'}題｜原始題號：${data.id}`;}else bank[type][index]=data;save();refreshInfo();renderList();alert(isNew?'已新增題目。':'已儲存修改。');};
$('deleteBtn').onclick=()=>{const type=$('editType').value,index=Number($('editIndex').value),q=bank[type][index];if(!q)return;if(!confirm(`確定要刪除原始題號 ${q.id} 嗎？此操作會同步儲存於本機題庫。`))return;bank[type].splice(index,1);save();refreshInfo();renderList();$('editor').classList.add('hidden');alert('已刪除題目。');};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(bank,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='urban-renewal-question-bank.json';a.click();URL.revokeObjectURL(a.href);};
$('importInput').onchange=async e=>{try{const files=[...e.target.files];if(!files.length)return;const merged={single_choice:[],multiple_choice:[]};for(const f of files){const d=JSON.parse(await f.text()),n=normalizeBank(d);merged.single_choice.push(...n.single_choice);merged.multiple_choice.push(...n.multiple_choice);}if(!merged.single_choice.length&&!merged.multiple_choice.length)throw Error('找不到 single_choice 或 multiple_choice 題目。');bank=merged;save();refreshInfo();renderList();$('editor').classList.add('hidden');alert(`已匯入：單選 ${bank.single_choice.length} 題、複選 ${bank.multiple_choice.length} 題。`);}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value='';}};
init().catch(err=>{ console.error(err); $('bankInfo').textContent='題庫載入失敗：請確認手機已連網後重新開啟。'; $('startBtn').textContent='題庫載入失敗'; });
</script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, getDoc, onSnapshot, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  // Firebase 網頁設定值不是密碼；真正的權限由 Firestore 安全規則驗證。
  const firebaseConfig = {
    apiKey: 'AIzaSyD2Vt6AXNTPYmo5E5j8qPhjup0X-715W14',
    authDomain: 'urban-renewal-exam.firebaseapp.com',
    projectId: 'urban-renewal-exam',
    storageBucket: 'urban-renewal-exam.firebasestorage.app',
    messagingSenderId: '55532864428',
    appId: '1:55532864428:web:7657b70db313e9cf0bb009',
    measurementId: 'G-LCV4C1W10D'
  };
  const ADMIN_EMAIL = 'skyfree357@gmail.com';
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  const configRef = doc(db, 'siteConfig', 'global');
  const questionBankRef = doc(db, 'questionBank', 'global');
  let siteIsOpen = null;
  let adminUser = null;
  let receivedInitialSiteStatus = false;
  let mainAdminMode = false;

  const gate = document.createElement('div');
  gate.id = 'siteGate';
  gate.classList.add('hidden');
  document.body.append(gate);
  const isAdmin = user => Boolean(user && user.email === ADMIN_EMAIL && user.emailVerified);

  function showAdminView(show) {
    document.getElementById('examView').classList.toggle('hidden', show);
    document.getElementById('adminView').classList.toggle('hidden', !show);
    document.getElementById('adminToggle').textContent = show ? '返回前台測驗' : '進入後台管理';
    if (show && typeof window.renderList === 'function') window.renderList();
  }

  function drawGate(message, actions = '') {
    gate.innerHTML = `<div class="site-gate-card"><p class="text-sm font-bold tracking-wider text-cyan-200">URBAN RENEWAL EXAM</p><h1 class="mt-3 text-2xl font-black">${message}</h1><p class="mt-3 text-sm leading-6 text-slate-200">系統目前暫停提供測驗服務。</p>${actions}</div>`;
    gate.classList.remove('hidden');
  }

  function refreshGate() {
    if (siteIsOpen === true) { gate.classList.add('hidden'); return; }
    // 讀取狀態期間不阻擋測驗；只有伺服器明確回覆「暫停」才關閉網站。
    if (siteIsOpen === null) { gate.classList.add('hidden'); return; }
    const actions = isAdmin(adminUser)
      ? `<div class="mt-6 space-y-3"><button id="openSiteNow" class="w-full rounded-xl bg-emerald-400 px-4 py-3 font-black text-emerald-950">立即開放網站</button><button id="signOutAdmin" class="w-full rounded-xl border border-white/30 px-4 py-3 font-bold">登出管理員</button></div>`
      : `<button id="gateAdminLogin" class="mt-6 w-full rounded-xl bg-white px-4 py-3 font-black text-slate-900">管理員以 Google 登入</button>`;
    drawGate('網站目前暫停開放', actions);
    document.getElementById('gateAdminLogin')?.addEventListener('click', () => requestSecureAdmin());
    document.getElementById('openSiteNow')?.addEventListener('click', () => setSiteOpen(true));
    document.getElementById('signOutAdmin')?.addEventListener('click', () => signOut(auth));
  }

  function ensureControlPanel() {
    if (!mainAdminMode) return;
    if (document.getElementById('remoteSiteControl')) return;
    const panel = document.createElement('section');
    panel.id = 'remoteSiteControl';
    panel.className = 'mb-5 rounded-3xl border border-amber-200 bg-amber-50 p-5 shadow-sm';
    panel.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-black text-amber-950">即時網站開關</h2><p id="remoteSiteStatus" class="mt-1 text-sm text-amber-900"></p></div><div class="flex flex-wrap gap-2"><button id="closeSiteNow" class="rounded-xl bg-red-600 px-4 py-3 text-sm font-bold text-white">立即暫停網站</button><button id="openSitePanel" class="rounded-xl bg-emerald-600 px-4 py-3 text-sm font-bold text-white">立即開放網站</button><button id="logoutGoogle" class="rounded-xl bg-slate-700 px-4 py-3 text-sm font-bold text-white">Google 登出</button></div></div>`;
    document.getElementById('adminView').prepend(panel);
    document.getElementById('closeSiteNow').onclick = () => setSiteOpen(false);
    document.getElementById('openSitePanel').onclick = () => setSiteOpen(true);
    document.getElementById('logoutGoogle').onclick = () => signOut(auth);
    updateControlPanel();
  }

  function updateControlPanel() {
    const status = document.getElementById('remoteSiteStatus');
    if (status) status.textContent = siteIsOpen === true ? '目前狀態：開放中' : siteIsOpen === false ? '目前狀態：暫停中' : '目前狀態：確認中';
  }

  function setSharedQuestionStatus(text, isError = false) {
    const status = document.getElementById('sharedQuestionStatus');
    if (!status) return;
    status.textContent = text;
    status.className = `mt-1 text-sm font-bold ${isError ? 'text-red-700' : 'text-indigo-700'}`;
  }

  // 副後台驗證成功後，將完整題庫寫入共用雲端資料；主後台開關仍採 Google 驗證。
  window.syncSharedQuestionBank = async updatedBank => {
    if (sessionStorage.getItem('staffAdminVerified') !== 'true') return;
    setSharedQuestionStatus('正在同步所有使用者的題庫…');
    try {
      await setDoc(questionBankRef, { bank: updatedBank, staffPassword: '0512', updatedAt: serverTimestamp() });
      setSharedQuestionStatus('已同步所有使用者的題庫。');
    } catch (error) {
      console.error('Unable to sync shared question bank', error);
      setSharedQuestionStatus('同步失敗，請再儲存一次。', true);
    }
  };

  async function setSiteOpen(open) {
    if (!isAdmin(auth.currentUser)) { alert('此帳號沒有管理權限。'); return; }
    try {
      await setDoc(configRef, { isOpen: open, updatedAt: serverTimestamp() }, { merge: true });
    } catch (error) {
      console.error(error);
      alert('狀態更新失敗，請確認 Google 登入後再試。');
    }
  }

  async function requestSecureAdmin() {
    try {
      if (!isAdmin(auth.currentUser)) {
        // 手機瀏覽器常限制彈出視窗，改用同樣安全的整頁 Google 登入流程。
        if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          await signInWithRedirect(auth, provider);
          return;
        }
        await signInWithPopup(auth, provider);
      }
      if (!isAdmin(auth.currentUser)) {
        await signOut(auth);
        alert('這個 Google 帳號沒有後台權限。');
        return;
      }
      mainAdminMode = true;
      ensureControlPanel();
      if (siteIsOpen === true) showAdminView(true);
      refreshGate();
    } catch (error) {
      console.error(error);
      alert('Google 登入未完成，請再試一次。');
    }
  }

  // 以 Google 已驗證帳號取代原本瀏覽器端的 4 位數密碼。
  document.getElementById('adminToggle').onclick = () => {
    if (!document.getElementById('adminView').classList.contains('hidden')) return showAdminView(false);
    requestSecureAdmin();
  };

  document.getElementById('staffToggle').onclick = () => {
    mainAdminMode = false;
    document.getElementById('remoteSiteControl')?.remove();
    if (!document.getElementById('adminView').classList.contains('hidden')) return showAdminView(false);
    document.getElementById('adminPasswordInput').value = '';
    document.getElementById('adminPasswordError').classList.add('hidden');
    document.getElementById('adminPasswordModal').classList.remove('hidden');
    document.getElementById('adminPasswordModal').classList.add('flex');
    setTimeout(() => document.getElementById('adminPasswordInput').focus(), 0);
  };

  onAuthStateChanged(auth, user => {
    adminUser = isAdmin(user) ? user : null;
    if (adminUser && mainAdminMode) ensureControlPanel();
    updateControlPanel();
    refreshGate();
  });

  function applySiteStatus(snapshot) {
    receivedInitialSiteStatus = true;
    siteIsOpen = snapshot.exists() ? snapshot.data().isOpen !== false : true;
    updateControlPanel();
    refreshGate();
  }

  // 先以一次性讀取取得狀態；部分手機網路會延後建立即時連線，不能因此把整個網站卡住。
  getDoc(configRef).then(applySiteStatus).catch(error => {
    console.error('Unable to read initial maintenance status', error);
    receivedInitialSiteStatus = true;
    siteIsOpen = true;
    refreshGate();
  });
  setTimeout(() => {
    if (!receivedInitialSiteStatus) {
      siteIsOpen = true;
      refreshGate();
    }
  }, 3500);

  onSnapshot(configRef, applySiteStatus, error => {
    console.error('Unable to read maintenance status', error);
    if (!receivedInitialSiteStatus) {
      siteIsOpen = true;
      refreshGate();
    }
  });

  onSnapshot(questionBankRef, snapshot => {
    const remoteBank = snapshot.exists() ? snapshot.data().bank : null;
    if (!remoteBank || !Array.isArray(remoteBank.single_choice) || !Array.isArray(remoteBank.multiple_choice)) {
      setSharedQuestionStatus('尚未建立共用題庫；首次儲存後會開始同步。');
      return;
    }
    try {
      bank = normalizeBank(remoteBank);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bank));
      refreshInfo();
      if (!document.getElementById('adminView').classList.contains('hidden')) renderList();
      setSharedQuestionStatus('已載入所有使用者共用題庫。');
    } catch (error) {
      console.error('Unable to load shared question bank', error);
      setSharedQuestionStatus('共用題庫資料格式錯誤。', true);
    }
  }, error => {
    console.error('Unable to listen shared question bank', error);
    setSharedQuestionStatus('共用題庫連線失敗，暫時使用本機題庫。', true);
  });
</script>
